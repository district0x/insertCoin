[tool.poetry]
name = "discord-bot"
version = "0.1.0"
description = "Discord bot for OneVOne platform"
authors = ["OneVOne Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
discord-py = "^2.5.0"
web3 = "^7.8.0"
python-dotenv = "^1.0.1"
aiohttp = "^3.11.12"
pydantic = "^2.10.6"
psycopg2-binary = "^2.9.10"
requests = "^2.32.4"
prisma = "^0.15.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

